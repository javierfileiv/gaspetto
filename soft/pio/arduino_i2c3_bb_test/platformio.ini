; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:arduino_i2c3_bb_test]
platform = ststm32@19.6.0
board = blackpill_f411ce
framework = arduino
monitor_port = /dev/ttyACM0
monitor_speed = 115200
test_port = /dev/ttyACM0
test_speed = 115200
test_transport = serial
upload_protocol = dfu
upload_command = dfu-util -d 0483:df11 -a 0 -s 0x08000000:leave -D $SOURCE
; Note: After DFU upload, wait ~8s for board to boot, then run:
; pio test -e arduino_i2c3_bb_test --without-uploading
build_type = debug
lib_deps =
	Wire
test_framework = unity
test_build_src = yes
build_flags =
	-D GBOX
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
