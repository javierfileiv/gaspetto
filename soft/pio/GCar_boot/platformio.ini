; GCar bootloader: lives in the first 32 kB (sectors 0-1) and hands control to
; the application at 0x08008000. It has no radio and no game logic on purpose:
; the smaller it stays, the less there is to break in the one image that cannot
; be reprogrammed over the air
[env:gcar_boot]
platform = ststm32@19.6.0
board = blackpill_f411ce
framework = arduino
board_upload.maximum_size = 16384
upload_protocol = dfu
monitor_speed = 115200
build_flags =
	-I ../../emu-pc/shared_types/include
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
build_type = release
extra_scripts = pre:../../../tools/pre_build.py
