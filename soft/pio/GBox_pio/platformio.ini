; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
upload_protocol = dfu
build_flags =
	-I lib/shared_types/include
	-I lib/state_machine_framework/include
	-I lib/radio_controller/include
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-DGASPETTO_LOG
	; -DGASPETTO_LOG_OVER_NRF24
	; ADC scan tuning
	; -D GASPETTO_I2C_CLOCK_HZ=100000
	; -D GASPETTO_ADC_SAMPLES_PER_CHANNEL=3
	; -D GASPETTO_ADC_MIN_VALID_SAMPLES=2
	; -D GASPETTO_ADC_READ_RECOVERY_RETRIES=1
	; -D GASPETTO_ADC_CONVERSION_TIMEOUT_MS=40
	; Piece decode thresholds (ADC raw)
	; -D GASPETTO_ADC_THRESHOLD_FORWARD_START=100
	; -D GASPETTO_ADC_THRESHOLD_BACKWARD_START=700
	; -D GASPETTO_ADC_THRESHOLD_TURN_RIGHT_START=1300
	; -D GASPETTO_ADC_THRESHOLD_TURN_LEFT_START=1900
	; -D GASPETTO_ADC_THRESHOLD_STOP_START=2500
	; -D GASPETTO_ADC_THRESHOLD_LOOP_START=3100
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
build_type = release
lib_deps =
	nrf24/RF24@^1.5.0
	adafruit/Adafruit ADS1X15@^2.5.0
	adafruit/Adafruit NeoPixel@^1.12.3

extra_scripts =
	pre:../../../tools/pre_build.py
	../../../tools/dfu_upload.py
